name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  isolation:
    # ubuntu-latest moved to 26.04, where `npx playwright install --with-deps chromium` fails for our pinned Playwright; revisit when Playwright supports it.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Downloads the pinned curriculum (about 3 MB) and checks every SHA-256
      # in lib/taxonomy-pin.mjs, so a bad pin bump fails here, not on a family's server.
      - name: Check the pinned taxonomy
        run: npm run taxonomy:check
