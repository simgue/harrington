name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  isolation:
    # ubuntu-latest moved to 26.04, where `npx playwright install --with-deps chromium` fails for our pinned Playwright; revisit when Playwright supports it.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Downloads the pinned curriculum (about 29 MB, the 23.5 MB teaching research
      # and the 2.7 MB curriculum standards included) and checks every SHA-256
      # in lib/taxonomy-pin.mjs, so a bad pin bump fails here, not on a family's
      # server. The first step also fills tests/e2e/.cache, which the server's
      # integrity tests (tests/taxonomy-pin.test.mjs) need; with CI set they
      # fail rather than skip without it.
      - name: Download the pinned taxonomy for the tests
        run: |
          node --input-type=module -e "const m = await import('./tests/e2e/support/taxonomy.mjs'); await m.ensureTaxonomyCache({ log: console.log });"

      - name: Check the pinned taxonomy
        run: npm run taxonomy:check

      - name: Run tests
        run: npm test

  # The Docker image (docs/DEPLOYMENT.md, the Synology section included) runs
  # as the unprivileged node user (GAPS.md G13), on a fresh volume it can
  # write to. Build it, check the user, and answer one health request and one
  # save from a running container.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t harrington:ci .

      - name: The image runs as node (uid 1000)
        run: |
          set -eu
          test "$(docker image inspect -f '{{.Config.User}}' harrington:ci)" = node
          test "$(docker run --rm harrington:ci id -u)" = 1000
          test "$(docker run --rm harrington:ci id -un)" = node
          test "$(docker run --rm harrington:ci stat -c %U /data)" = node

      - name: Smoke test a running container
        run: |
          set -eu
          docker volume create harrington-ci-data
          docker run -d --name harrington-ci -p 127.0.0.1:4173:4173 -v harrington-ci-data:/data harrington:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/api/health > /dev/null && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/api/health)" = 200
          # The server process itself, not only a fresh shell, is uid 1000.
          docker exec harrington-ci grep -E '^Uid:[[:space:]]+1000[[:space:]]' /proc/1/status
          # A save lands in the volume, so /data is writable by node. The
          # document is at the current data format (src/js/schema.js).
          format=$(node --input-type=module -e "import { SCHEMA_VERSION } from './src/js/schema.js'; console.log(SCHEMA_VERSION)")
          status=$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:4173/api/state \
            -H 'Content-Type: application/json' -H 'If-Match: "v0"' \
            --data '{"schemaVersion":'"$format"',"students":[{"id":"student-1","name":"Sample Learner","birthYear":2018}],"activeStudentId":"student-1","progress":{}}')
          test "$status" = 204
          docker exec harrington-ci test -s /data/family-state.json

      - name: Container log
        if: ${{ always() }}
        run: docker logs harrington-ci || true
