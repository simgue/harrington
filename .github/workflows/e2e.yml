name: E2E

# Docs-only changes (including the committed screenshots) skip the suite.
# If this check is ever made required, a docs-only pull request would wait on
# it forever; drop the filter then.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The Marble taxonomy is downloaded at the commit pinned in
      # tests/e2e/support/taxonomy.mjs (TAXONOMY_REVISION) and cached, never
      # committed. Changing the pin changes the file hash, so the key follows it.
      - name: Cache the taxonomy download
        uses: actions/cache@v4
        with:
          path: tests/e2e/.cache
          key: marble-taxonomy-${{ hashFiles('tests/e2e/support/taxonomy.mjs') }}

      - name: Run the end-to-end suite
        run: npm run e2e

      - name: Upload the HTML report
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        id: screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: docs/e2e/screenshots/
          retention-days: 14

      - name: Upload videos
        id: videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos
          path: |
            test-results/**/*.webm
            docs/e2e/recordings/
          retention-days: 14
          if-no-files-found: ignore

      # One click from the pull request's checks to the report and recordings.
      - name: Link the artifacts in the job summary
        if: ${{ !cancelled() }}
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          SCREENSHOTS_URL: ${{ steps.screenshots.outputs.artifact-url }}
          VIDEOS_URL: ${{ steps.videos.outputs.artifact-url }}
        run: |
          {
            echo "## End-to-end artifacts (kept 14 days)"
            echo
            [ -n "$REPORT_URL" ] && echo "- [HTML report]($REPORT_URL) (unzip, then \`npx playwright show-report <folder>\`)"
            [ -n "$SCREENSHOTS_URL" ] && echo "- [Screenshots]($SCREENSHOTS_URL)"
            [ -n "$VIDEOS_URL" ] && echo "- [Recordings]($VIDEOS_URL): the three walkthrough videos"
            echo
            if [ -f test-results/results.json ]; then
              node -e 'const s=require("./test-results/results.json").stats; console.log(`${s.expected} passed, ${s.unexpected} failed, ${s.flaky} flaky, ${s.skipped} skipped in ${Math.round(s.duration/1000)} s`)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
