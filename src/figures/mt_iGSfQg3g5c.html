<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ice in the sun</title>
<meta name="description" content="Make the sun come out, move the shade, and see which ice melts first.">
</head>
<body>
<script>
/* Harrington figure engine (src/js/figures/engine.js). MIT License. Copyright (c) 2026 April Zhu; Copyright (c) 2026 Tolga Cohce. The full notice is in src/js/figures/engine.js and NOTICE. */
// ---- engine ----
// Everything below this line is inlined into each built figure page (scripts/build-figures.mjs).
// One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front
// is lit, the left side is in shade, and cast shadows fall toward the lower left of the screen).

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* VIEW turns the object in 90° steps about a vertical axis through its centre (RC):
   0 = front (+x) and left (+y) faces toward the viewer, 1 = turned once (the +y side becomes the front)…
   Figures keep modelling in their own coordinates; P / Dv / vis / tone / depthOf all apply the turn. */
let VIEW = 0, RC = [0, 0];
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];                 // the views the UI offers: front and back (figures still draw correctly in all four)
const rotV = ([x,y,z]) => { switch (VIEW & 3){ case 1: return [y,-x,z]; case 2: return [-x,-y,z]; case 3: return [-y,x,z]; default: return [x,y,z]; } };
const rotXY = (x,y) => { const r = rotV([x-RC[0], y-RC[1], 0]); return [r[0]+RC[0], r[1]+RC[1]]; };
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso, no turn
const P  = (x,y,z) => { const [a,b] = rotXY(x,y); return [(a-b)*C + OX, (a+b)*S - z + OY]; };
const Dv = (x,y,z) => { const [a,b,c] = rotV([x,y,z]); return [(a-b)*C, (a+b)*S - c]; };
// distance toward the viewer in the current view: draw parts with smaller depth first
const depthOf = p => { const [a,b] = rotXY(p[0],p[1]); return a + b + p[2]; };
// sort [{at:[x,y,z], svg}] back-to-front for the current view and join
const byDepth = parts => parts.filter(Boolean).sort((p,q) => depthOf(p.at) - depthOf(q.at)).map(p => p.svg).join('');
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
const tone  = (n,m) => { const d=dot(rotV(n),L);   return d>-.15 ? m.l : d>-.45 ? m.m : m.d; };   // exterior, follows the sun
const toneI = (n,m) => { const d=dot(rotV(n),LIN); return d>.6 ? m.l : d>.05 ? m.m : m.d; };      // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). color(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, color, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), color(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
const txM = (o, U, V) => `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K;
  const s = fill(sp(hull(pts3.map(([x,y,z]) => { const [a,b] = rotXY(x,y); return P0(a+(z-z0)*SH[0]*k, b+(z-z0)*SH[1]*k, z0); }))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent color). Labels can be hidden with the Labels switch.
// LABEL_K grows the pills when the figure is drawn small (a phone), so their text stays readable.
let LABEL_K = 1;
function tag(p3, dx, dy, text, on=false){
  const k = INK_K, [X,Y] = P(...p3), fs = 8.6*k*LABEL_K, w = text.length*fs*.62 + fs*1.5, h = fs*1.8, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${text}</text></g>`;
}
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all
   figures match the reference zoom of the booth / vending machine (viewBox ≈ 585 units wide). */
const INK_REF_VB = 585;
let INK_K = 1;
const inkScale = svg => INK_K === 1 ? svg : svg.replace(/stroke-width="([\d.]+)"/g, (_, w) => `stroke-width="${(+w * INK_K).toFixed(2)}"`);


/* ---------- page shell ----------
   Harrington's paper look: the topic page or the child view shows the figure in a sandboxed iframe, so the page
   is one column that fills the frame: the action buttons, the figure, then the Labels switch and body colors.
   Every control is at least 44 px tall. Text from a figure (button labels, choices, notes, stats) is set with
   textContent. */
const CORE_CSS = `
  :root{--paper:#fbf6ec;--card:#fffdf8;--ink:#2e2a24;--muted:#6f665a;--rule:#ede3cf;--focus:#2f6285}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font:600 14px/1.3 ui-rounded,"Lexend Variable",Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;padding:10px 12px 6px}
  button{font:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation}
  button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .actions{position:relative;display:flex;flex-wrap:wrap;gap:8px;z-index:3}
  .stepwrap{position:relative}
  .act{min-height:44px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:0 16px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
  .act:hover{background:#fbecc4} .act:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
  .act .car{margin-left:6px;font-size:11px}
  .chips{display:none;flex-wrap:wrap;gap:6px;background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);
    padding:8px;width:max-content;max-width:min(320px,calc(100vw - 24px));position:absolute;left:0;top:calc(100% + 6px);z-index:4}
  .stepwrap.open .chips{display:flex}
  .chip{min-height:44px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:0 12px;white-space:nowrap}
  .chip:hover{background:var(--accent,#f2c14e)}
  .chip.current{background:var(--ink);color:var(--paper)} .chip.off{opacity:.5}
  .stage{position:relative;flex:1;min-height:0}
  #fig{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;overflow:visible;touch-action:manipulation}
  #fig [data-act]{cursor:pointer}
  html.nolabels #fig .tag{display:none}
  /* ui.flash(text): a short note at the top of the figure ("the cup is empty, fill it first") */
  .toast{position:absolute;left:0;top:6px;z-index:2;font-size:13px;background:var(--card);border:2px solid var(--ink);border-radius:10px;
    padding:6px 10px;box-shadow:2px 2px 0 var(--ink);opacity:0;transition:opacity .2s;pointer-events:none;max-width:min(300px,70%)}
  .toast.show{opacity:1}
  .stats{position:absolute;top:4px;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:2;text-align:right;pointer-events:none}
  .stat .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-size:28px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
  .stat.small .v{font-size:18px}
  .stat .v.bump{animation:bump .35s ease-out}
  @keyframes bump{0%{transform:scale(1.18)}100%{transform:none}}
  .controls{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:4px}
  .tog{min-height:44px;background:transparent;border:2px solid var(--ink);border-radius:999px;padding:0 14px}
  .tog[aria-pressed=true]{background:#e4eedf}
  .tog[hidden]{display:none}
  .pals{display:flex;gap:0}
  .sw{width:44px;height:44px;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center}
  .sw span{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);display:block}
  .sw[aria-pressed=true] span{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
  @media (max-width:420px){body{padding:8px 8px 4px}.act{padding:0 12px}.stat .v{font-size:22px}}

const filterFor = k => `<filter id="hand" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="${(0.045/k).toFixed(4)}" numOctaves="2" seed="4" result="warp"/>
  <feDisplacementMap in="SourceGraphic" in2="warp" scale="${(2.4*k).toFixed(2)}" xChannelSelector="R" yChannelSelector="G" result="wob"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.9/k).toFixed(4)}" numOctaves="3" seed="11" result="n1"/>
  <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .84  .3 0 0 0 .84  .3 0 0 0 .84  0 0 0 0 1" result="grain"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.012/k).toFixed(4)}" numOctaves="2" seed="7" result="n2"/>
  <feColorMatrix in="n2" type="matrix" values=".3 0 0 0 .85  .3 0 0 0 .85  .3 0 0 0 .85  0 0 0 0 1" result="blot"/>
  <feBlend in="wob" in2="grain" mode="multiply" result="g1"/><feBlend in="g1" in2="blot" mode="multiply" result="g2"/>
  <feComposite in="g2" in2="wob" operator="in"/></filter>`;

/* mountFigure({
     title:'Toy cart',             // the page title and the figure's accessible name
     size:[W,D,H],                 // bounding box, used to frame the view (shadow range included)
     palette:'mustard',            // default PALS key
     state:{...},                  // figure state (st.pal is built in)
     scene: (st, m) => svgString,  // m = current palette {l,m,d}
     buttons: [{label, onClick(st, ui)}      // listed in the order the child should press them
               | {label, choices: st => [{label, onClick(st,ui), current?, disabled?, why?}]}],   // opens a picker

     acts: { name(st, el, ui){} },  // presses on act(name, …) groups; el has dataset

   })  -> ui = { st, render, animate(stepFn), flash(text,ms) }

const noteError = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };

function mountFigure(cfg){
  document.title = cfg.title;
  const style = document.createElement('style'); style.textContent = CORE_CSS; document.head.appendChild(style);
  document.body.innerHTML = `
    <div class="actions" id="btns" role="group" aria-label="Try it"></div>
    <div class="stage">
      <div class="stats" id="stats"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <svg id="fig" role="img"><defs id="fdefs"></defs><g id="art" filter="url(#hand)"></g></svg>
    </div>
    <div class="controls">
      <button class="tog" id="lbl" type="button" aria-pressed="true" hidden>Labels on</button>
      <div class="pals" id="pals" role="group" aria-label="Color"></div>
    </div>`;
  const svg = document.getElementById('fig');
  svg.setAttribute('aria-label', cfg.title);
  const st = cfg.state || {};            // kept as the same object, so a figure may hold on to it
  if (!st.pal) st.pal = cfg.palette || 'mustard';

  const q = new URLSearchParams(location.search);

  if (cfg.params) cfg.params(st, q);

  for (const x of [0,W]) for (const y of [0,D]) for (const z of [0,H]) pts.push(P(x,y,z));
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);

  const vbW = Math.max(bw/.74, bh/.88/.75), vbH = vbW*.75;

  addEventListener('resize', () => { fitLabels(); ui.render(); });
  fitLabels();
  ui.render = () => { _clipN = 0; document.documentElement.style.setProperty('--accent', PALS[st.pal].l); art.innerHTML = inkScale(cfg.scene(st, PALS[st.pal])); ui.drawStats(); };
  // big numbers in the top-right corner (a temperature, a count); a value that changes gets a little bump
  const statsEl = document.getElementById('stats'), prevStats = {};
  ui.drawStats = () => { if (!cfg.stats) return;
    const list = cfg.stats(st).filter(Boolean), key = JSON.stringify(list.map(x => [x.label, String(x.value), !!x.small]));
    if (statsEl._key === key) return;
    statsEl._key = key;
    statsEl.replaceChildren(...list.map(x => {
      const box = document.createElement('div'), k = document.createElement('div'), v = document.createElement('div');
      box.className = 'stat' + (x.small ? ' small' : ''); k.className = 'k'; v.className = 'v';
      k.textContent = x.label; v.textContent = String(x.value);
      if (prevStats[x.label] != null && prevStats[x.label] !== v.textContent) v.classList.add('bump');
      prevStats[x.label] = v.textContent;
      box.append(k, v); return box; })); };
  let flashT = 0;
  const toast = document.getElementById('toast');
  ui.flash = (text, ms=2200) => { toast.textContent = text; toast.classList.add('show');
    clearTimeout(flashT); flashT = setTimeout(() => toast.classList.remove('show'), ms); };
  // animations run on a ~60 fps timer rather than requestAnimationFrame, so they also run in headless test shots
  ui.animate = step => { let last = performance.now();
    const loop = () => { const now = performance.now(), dt = Math.max(0, Math.min(.05,(now-last)/1000)); last = now; const more = step(dt) !== false; ui.render(); if (more) setTimeout(loop, 16); };
    setTimeout(loop, 16); };

  // clickable parts react on press, not on click: while something animates, the scene is redrawn every frame, so the
  // element under the pointer is replaced between press and release and a 'click' would never fire
  svg.addEventListener('pointerdown', e => { if (e.button) return; const a = e.target.closest('[data-act]'); if (!a || !cfg.acts || !cfg.acts[a.dataset.act]) return;
    e.preventDefault(); cfg.acts[a.dataset.act](st, a, ui); ui.render(); });
  const btns = document.getElementById('btns');
  (cfg.buttons || []).forEach(b => {
    const wrap = document.createElement('div'); wrap.className = 'stepwrap';
    const el = document.createElement('button'); el.className = 'act'; el.type = 'button';
    el.textContent = b.label;

    wrap.appendChild(el); btns.appendChild(wrap);
    if (!b.choices){ el.onclick = () => { closeChips(); b.onClick(st, ui); ui.render(); }; return; }
    const chips = document.createElement('div'); chips.className = 'chips'; wrap.appendChild(chips);
    el.onclick = e => { e.stopPropagation(); const open = !wrap.classList.contains('open'); closeChips();
      if (!open) return;
      chips.replaceChildren();
      // every choice stays clickable, so nothing silently ignores a press:
      //   current:true  = the one in use (shown selected); a press just says so
      //   disabled:true = not possible right now (shown faded); a press says why (c.why, or a generic note)
      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.type = 'button'; ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;

      chips.style.left = '0px';

  });
  function closeChips(){ document.querySelectorAll('.stepwrap.open').forEach(w => { w.classList.remove('open'); w.querySelector('.act').setAttribute('aria-expanded', 'false'); }); }
  document.addEventListener('click', closeChips);

  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'sw'; b.setAttribute('aria-label', k); b.setAttribute('aria-pressed', k === st.pal);
    const dot = document.createElement('span'); dot.style.background = p.l; b.appendChild(dot);
    b.onclick = () => { st.pal = k; [...pals.children].forEach(c => c.setAttribute('aria-pressed', c === b)); ui.render(); };
    pals.appendChild(b);
  }

  const lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'Labels on' : 'Labels off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Put in>Coin@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteError(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c) c.click(); else noteError(`no choice "${choice}" in "${label}"`); }, +ms || 0); });

}

<script>
// title: Ice in the sun
// hint: Make the sun come out, move the shade, and see which ice melts first.
/* Sunlight warms things up (mt_iGSfQg3g5c): two dishes with an ice cube and a thermometer each; a shade roof
   stands over the right dish. When the sun comes out from behind the cloud, sunlight warms the dish it reaches:
   its thermometer climbs and its ice melts fast; the dish in the shade stays cooler and its ice melts slowly.
   Real sequence: ice from the tray -> into each dish -> sun comes out -> the sunny dish warms first and its ice
   melts -> pour away the water, take fresh ice from the tray. */
const BW = 86, BD = 170, BH = 4;
const DR = 15, DZ = BH + 3;                       // dish radius, dish top
const DISH = [[46, 136], [51, 78]];               // left dish (always in the open), right dish (under the roof)
const ROOF = { x0: 31, x1: 79, y0: 38, y1: 80, z: 46 };
const POSTS = [[33, 40], [33, 78]];
const TRAY = { x0: 60, x1: 82, y0: 6, y1: 30 };
const CELLS = [[66, 11], [76, 11], [66, 18], [76, 18], [66, 25], [76, 25]];
const SUN = [54, 44, 99];
const ICE = { l: '#eef9fd', m: '#c9eaf6', d: '#9fd0e4' };
const PLASTIC = matOf('#a9cde8');
const SHADEM = { l: '#f4e7c9', m: '#dccca8', d: '#a8977a' };
const WARM = 74, HOT = 96, COOL = 62;             // degrees F: cloudy day, in the shade, in the sun

const st = { pal: 'mustard', sunny: false, cloud: 1, shade: true, ice: [1, 1], water: [0, 0], T: [COOL, COOL], tray: 6, moving: null, running: false };

const lit = i => st.sunny && !(i === 1 && st.shade);   // does sunlight reach dish i?
const target = i => !st.sunny ? COOL : lit(i) ? HOT : WARM;

/* ---------- drawing ---------- */
function cube(x, y, z, s){ return box(x - s / 2, y - s / 2, z, x + s / 2, y + s / 2, z + s, ICE, toneI, 1.1)
  + fill(pd([[x + s / 2 + .1, y + s * .25, z + s * .3], [x + s / 2 + .1, y + s * .05, z + s * .3], [x + s / 2 + .1, y - s * .2, z + s * .85], [x + s / 2 + .1, y, z + s * .85]]), '#ffffff', 'opacity=".6"'); }
function dish(i){
  const [x, y] = DISH[i], ice = st.ice[i];
  let s = cyl(x, y, BH, DZ, DR, CERAMIC, toneI, 1.3, 28);
  s += fill(pd(on(PZ(DZ + .05), ellUV(x, y, DR - 2.2, DR - 2.2, 28))), CERAMIC.m);
  const wet = Math.min(DR - 3, 3 + 10 * st.water[i]);                      // melt water spreads in the dish
  if (st.water[i] > .02) s += shape(on(PZ(DZ + .1), ellUV(x, y, wet, wet * .92, 24)), '#a9d8ee', .6);
  if (ice > .02) s += cube(x, y, DZ, 4 + 10 * ice);
  return s;
}
function thermometer(i){
  const [x, y] = DISH[i], tx = x - 9, ty = y + 7, top = DZ + 34;
  const level = DZ + 5 + Math.max(0, Math.min(1, (st.T[i] - 50) / 50)) * 27;
  let s = rod([tx, ty, DZ], [tx, ty, top], 2, CERAMIC, toneI, 1.1);
  s += rod([tx + .4, ty, DZ + 2], [tx + .4, ty, level], .95, matOf('#e2483d'), toneI, .5);
  const [bx, by] = P(tx, ty, DZ + 2.2);
  s += `<circle cx="${f(bx)}" cy="${f(by)}" r="3.4" fill="#e2483d" stroke="${INK}" stroke-width="1"/>`;
  for (let k = 0; k < 4; k++) s += line([[tx + 2, ty, DZ + 10 + k * 7], [tx + 2, ty - 1.6, DZ + 10 + k * 7]], .6);
  return s;
}
function tray(){
  let s = box(TRAY.x0, TRAY.y0, BH, TRAY.x1, TRAY.y1, BH + 4, PLASTIC, toneI, 1.2);
  CELLS.forEach(([x, y], k) => {
    s += shape(on(PZ(BH + 4.05), rectUV(x - 3.4, y - 2.8, x + 3.4, y + 2.8)), k < st.tray ? '#dff2fa' : PLASTIC.d, .6);
    if (k < st.tray) s += box(x - 2.6, y - 2.2, BH + 4, x + 2.6, y + 2.2, BH + 7, ICE, toneI, .8);
  });
  return s;
}
const roofPts = () => [[ROOF.x0, ROOF.y0, ROOF.z], [ROOF.x1, ROOF.y0, ROOF.z], [ROOF.x1, ROOF.y1, ROOF.z], [ROOF.x0, ROOF.y1, ROOF.z]];
// a pale sunbeam from the sun to a point (where it lands: a dish, or the roof that stops it)
function beam(to, w){
  const a = [SUN[0], SUN[1] - 3, SUN[2]], b = [SUN[0], SUN[1] + 3, SUN[2]];
  return fill(pd([a, b, [to[0], to[1] + w, to[2]], [to[0], to[1] - w, to[2]]]), '#ffe58a', 'opacity=".42"');
}
// which = 'dishes' (drawn early, under everything) or 'roof' (the beam the roof stops, drawn on top of the roof)
function beams(which){
  if (!st.sunny || st.cloud > .6) return '';
  let s = '';
  if (which === 'dishes'){
    s += beam([DISH[0][0], DISH[0][1], DZ], 12);
    if (!st.shade) s += beam([DISH[1][0], DISH[1][1], DZ], 12);
  } else if (st.shade){
    const t = (SUN[2] - ROOF.z - 2.4) / (SUN[2] - DZ);
    s += beam([SUN[0] + (DISH[1][0] - SUN[0]) * t, SUN[1] + (DISH[1][1] - SUN[1]) * t, ROOF.z + 2.4], 12);
  }
  return `<g opacity="${f(1 - st.cloud)}">${s}</g>`;
}
function sun(){
  const [x, y] = P(...SUN), r = 10;
  let s = '';
  for (let k = 0; k < 10; k++){ const a = k / 10 * 2 * Math.PI, c = Math.cos(a), d = Math.sin(a);
    s += `<path d="M${f(x + c * 13)} ${f(y + d * 13)}L${f(x + c * 18)} ${f(y + d * 18)}" stroke="${INK}" stroke-width="1.4" stroke-linecap="round"/>`; }
  s += `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="#f6c844" stroke="${INK}" stroke-width="1.6"/>`;
  // the cloud: in front of the sun when it is cloudy, drifting off to the right as the sun comes out
  const cx = x + 4 + (1 - st.cloud) * 46, cy = y + 4, op = .25 + .75 * st.cloud;
  const puffs = [[-11, 3, 8], [-2, -3, 10.5], [9, 1, 9], [16, 5, 6.5], [-17, 6, 5.5]];
  let c = '';
  for (const [dx, dy, pr] of puffs) c += `<circle cx="${f(cx + dx)}" cy="${f(cy + dy)}" r="${pr}" fill="#fbfaf3" stroke="${INK}" stroke-width="1.3"/>`;
  for (const [dx, dy, pr] of puffs) c += `<circle cx="${f(cx + dx)}" cy="${f(cy + dy)}" r="${pr - 1.1}" fill="#fbfaf3"/>`;
  c += `<path d="M${f(cx - 20)} ${f(cy + 11)}L${f(cx + 22)} ${f(cy + 11)}" stroke="#dcd8ca" stroke-width="2"/>`;
  return s + `<g opacity="${f(op)}">${c}</g>`;
}
function moving(){
  const m = st.moving; if (!m) return '';
  const t = ease(Math.min(1, m.t)), [x0, y0] = CELLS[m.from], [x1, y1] = DISH[m.to];
  return cube(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, BH + 7 + (DZ - BH - 7) * t + 22 * Math.sin(Math.PI * t), 5 + 9 * t);
}

function scene(st){
  const bt = boardTop(0, 0, BW, BD, BH, 6);
  let s = board(0, 0, BW, BD, BH, 6, BOARD);
  // a sharp shadow only when the sun is out; on a cloudy day the roof casts none
  if (st.shade && st.cloud < 1) s += `<g opacity="${f(1 - st.cloud)}">${castShadow([...roofPts(), ...POSTS.map(([x, y]) => [x, y, BH])], BH, bt)}</g>`;
  s += beams('dishes');
  s += tray();
  if (st.shade) for (const [x, y] of POSTS) s += rod([x, y, BH], [x, y, ROOF.z], 1.1, WOOD, toneI, 1);
  s += dish(1) + thermometer(1);
  if (st.shade && st.sunny) s += `<g opacity="${f(.28 * (1 - st.cloud))}">${clipTo(on(PZ(DZ), ellUV(DISH[1][0], DISH[1][1], DR + 1, DR + 1)), fill(pd(on(PZ(DZ), ellUV(DISH[1][0], DISH[1][1], DR + 1, DR + 1))), SHADOW))}</g>`;
  if (st.shade) s += box(ROOF.x0, ROOF.y0, ROOF.z, ROOF.x1, ROOF.y1, ROOF.z + 2.4, SHADEM, toneI, 1.4) + beams('roof');
  s += dish(0) + thermometer(0);
  s += moving();
  s += sun();
  const [ax, ay] = DISH[0];
  s += tag(SUN.map((v, k) => k === 2 ? v - 10 : v), -64, 4, 'SUN', st.sunny);
  if (st.shade) s += tag([ROOF.x1, ROOF.y0 + 6, ROOF.z + 2.4], 54, -18, 'SHADE', st.sunny);
  if (st.ice[0] > .02) s += tag([ax + 2, ay - 2, DZ + 4 + 10 * st.ice[0]], 50, 20, 'ICE', st.sunny && st.ice[0] > .02);
  s += tag([ax - 9, ay + 7, DZ + 30], -56, -26, 'THERMOMETER', st.T[0] < target(0) - .5);
  return s;
}

/* ---------- behavior ---------- */
let ui;
const steady = () => !st.moving && Math.abs(st.cloud - (st.sunny ? 0 : 1)) < .001
  && st.T.every((T, i) => Math.abs(T - target(i)) < .3) && st.ice.every((v, i) => v <= 0 || st.T[i] <= COOL + 2);
function run(){
  if (st.running) return;
  st.running = true;
  ui.animate(dt => {
    const goal = st.sunny ? 0 : 1;
    st.cloud += Math.sign(goal - st.cloud) * Math.min(Math.abs(goal - st.cloud), dt / .9);
    for (let i = 0; i < 2; i++){
      const want = st.sunny ? COOL + (target(i) - COOL) * (1 - st.cloud) : target(i);
      st.T[i] += (want - st.T[i]) * Math.min(1, dt * .9);
      // warmer than a cool day melts the ice: about 4 s in the sun, much longer in the shade
      const melt = Math.min(st.ice[i], Math.max(0, st.T[i] - (COOL + 2)) / (HOT - COOL - 2) * .26 * dt);
      st.ice[i] -= melt; st.water[i] = Math.min(1, st.water[i] + melt);
    }
    if (st.moving){
      st.moving.t += dt / .9;
      if (st.moving.t >= 1){ st.ice[st.moving.to] = 1; st.moving = st.moving.next; }
    }
    if (steady()){ st.running = false; return false; }
    return true;
  });
}
function sunOut(){
  if (st.sunny) return ui.flash('The sun is already out. Watch the ice!');
  st.sunny = true; run();
}
function cloudIn(){
  if (!st.sunny) return ui.flash('The sun is already behind the cloud.');
  st.sunny = false; run();
}
function toggleShade(){
  st.shade = !st.shade;
  ui.flash(st.shade ? 'Shade on: the right dish is in the shade.' : 'Shade off: both dishes are in the sun.');
  run();
}
function freshIce(){
  if (st.moving) return ui.flash('Wait: fresh ice is on its way.');
  const need = [0, 1].filter(i => st.ice[i] < .9);
  if (!need.length) return ui.flash('The ice has not melted yet.');
  if (st.tray < need.length){
    ui.flash('The tray is empty. It goes in the freezer to make more ice.');
    setTimeout(() => { st.tray = 6; ui.render(); }, 1600);
    return;
  }
  // pour away the melt water, then a cube from the tray into each dish that needs one
  let chain = null;
  for (const i of need.slice().reverse()){ st.tray--; chain = { from: st.tray, to: i, t: 0, next: chain }; }
  for (const i of need){ st.ice[i] = 0; st.water[i] = 0; }
  st.moving = chain;
  run();
}

ui = mountFigure({
  title: 'Ice in the sun',
  size: [BW, BD, 104], palette: 'mustard', state: st,
  scene,
  stats: st => [{ label: 'Left dish', value: `${Math.round(st.T[0])}°F` }, { label: 'Right dish', value: `${Math.round(st.T[1])}°F`, small: true }],
  buttons: [
    { label: 'Sun comes out', onClick: sunOut },
    { label: 'Cloud covers sun', onClick: cloudIn },
    { label: 'Shade on or off', onClick: toggleShade },
    { label: 'Fresh ice', onClick: freshIce },
  ],
  acts: {},
  params: (st, q) => {
    if (q.get('sunny') === '1'){ st.sunny = true; st.cloud = 0; }
    if (q.get('shade') === '0') st.shade = false;
    if (q.has('ice')) { const v = q.get('ice').split(',').map(Number); st.ice = [v[0], v[1] ?? v[0]].map(x => Math.max(0, Math.min(1, x))); st.water = st.ice.map(x => 1 - x); }
    if (q.has('temp')) { const v = q.get('temp').split(',').map(Number); st.T = [v[0], v[1] ?? v[0]]; }
    if (q.has('tray')) st.tray = Math.max(0, Math.min(6, +q.get('tray')));
  },
});
</script>
</body>
</html>
